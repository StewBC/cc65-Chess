# Apple II layout for cc65 Chess.
#
# The other five targets have carried a project cfg for a while; the Apple II
# was the one still on cc65's stock apple2.cfg with the addresses passed as
# link flags.  It needed its own for one reason: it was the tightest machine
# in the tree by an order of magnitude - 460 bytes between the top of BSS and
# the stack, against 8438 on the Atari and 27488 on the Plus/4 - and the
# reason was layout, not appetite.
#
# The program starts at $4000 because HGR page 1 is at $2000-$3FFF and the
# code has to live above it.  That leaves $0800-$1FFF sitting unused below the
# graphics page for the whole run: loader.system occupies $2000 while it
# loads and is dead the moment it jumps, text page 1 is at $0400, and this
# build never asks ProDOS for a file buffer after launch.  Six kilobytes,
# stranded by an address rather than spent.
#
# So BSS moves down there and the file image keeps the whole of $4000 up to
# the stack.  Both halves gain: BSS has 6144 bytes to grow into where it had
# 460, and CODE/RODATA/DATA get back the 3756 bytes BSS used to occupy at the
# top of MAIN.
#
# Three things to keep in mind when editing this:
#
#   LOW must stop at $2000.  Stock apple2.cfg sizes it %S - $0800, which is
#   $0800-$3FFF here - straight through the graphics page.  Anything the
#   linker put above $2000 would be overwritten by the first thing drawn, and
#   the failure would look like data corruption rather than a bad address.
#
#   $1E00-$1E1E holds 31 bytes the loader leaves behind - ascending page
#   numbers $08..$26.  Nothing writes them again once the program is running
#   and zerobss clears them the moment BSS grows that far, so they are inert;
#   they are noted here only so that finding them during a memory dump does
#   not look like a bug.
#
#   MAIN now has to leave room for the stack itself.  Stock lets MAIN run to
#   __HIMEM__ and relies on BSS - which used to be the last thing up there -
#   to stop at __HIMEM__ - __STACKSIZE__.  With BSS moved out, nothing else
#   would have stopped CODE growing into the stack.

FEATURES {
    STARTADDRESS: default = $4000;      # above HGR page 1
}
SYMBOLS {
    __EXEHDR__:    type = import;
    __FILETYPE__:  type = weak, value = $0006; # ProDOS file type
    __STACKSIZE__: type = weak, value = $0800; # 2k stack
    __HIMEM__:     type = weak, value = $BF00; # below the ProDOS global page
    __LCADDR__:    type = weak, value = $D400; # Behind quit code
    __LCSIZE__:    type = weak, value = $0C00; # Rest of bank two
}
MEMORY {
    ZP:     file = "", define = yes, start = $0080,      size = $001A;
    HEADER: file = %O,               start = %S - $003A, size = $003A;
    MAIN:   file = %O, define = yes, start = %S,         size = __HIMEM__ - __STACKSIZE__ - %S;
    BSS:    file = "",               start = $0800,      size = $1800;
    LC:     file = "", define = yes, start = __LCADDR__, size = __LCSIZE__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,             type = zp;
    EXEHDR:   load = HEADER,         type = ro,  optional = yes;
    STARTUP:  load = MAIN,           type = ro;
    LOWCODE:  load = MAIN,           type = ro,  optional = yes;
    CODE:     load = MAIN,           type = ro;
    RODATA:   load = MAIN,           type = ro;
    DATA:     load = MAIN,           type = rw;
    INIT:     load = MAIN,           type = rw;  # uninitialized, but reserves output space
    ONCE:     load = MAIN,           type = ro,  define   = yes;
    LC:       load = MAIN, run = LC, type = ro,  optional = yes;
    BSS:      load = BSS,            type = bss, define   = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}

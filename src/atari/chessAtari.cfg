# The load address is $1000, not cc65's usual $2000, and MAIN stops at $9100
# rather than running up to the stack.  Both are deliberate, and the second one
# is the important one.
#
# hiresAtari.s puts the GR.8 framebuffer at a hard-coded "scrn = $9100", 7680
# bytes to $AEFF.  Nothing ever told the linker, so ld65 happily placed BSS
# there and reported a build that fits.  It did not fit: the top of the screen
# was showing BSS as pixels, and the engine's state was being overwritten by
# whatever was drawn.  That is why this target "needed optsize" - optsize was
# not smaller-so-it-fits, it was small enough to end below $9100 by 1751 bytes
# where optspeed ended 553 bytes inside the screen.
#
# Capping MAIN at $9100 makes that a link error instead of a corrupted display.
# Dropping the start to $1000 pays for the cap: MEMLO is $0700 with MyPicoDOS,
# but $0800 crashes on load - the loader is still down there while it works -
# and $1000 boots, plays and leaves 2771 bytes spare at optsize.  Verified
# under AltirraSDL's bridge: MyPicoDOS boot, menus, an AI-vs-AI game.
#
# Still unclaimed if this ever gets tight again: $AF00-$B41F, 1312 bytes
# between the end of the screen and the 2K software stack.
FEATURES {
    STARTADDRESS: default = $1000;
}
SYMBOLS {
    __EXEHDR__:          type = import;
    __SYSTEM_CHECK__:    type = import;  # force inclusion of "system check" load chunk
    __AUTOSTART__:       type = import;  # force inclusion of autostart "trailer"
    __STACKSIZE__:       type = weak, value = $0800; # 2k stack
    __STARTADDRESS__:    type = export, value = %S;
    __RESERVED_MEMORY__: type = weak, value = $0000;
}
MEMORY {
    ZP:         file = "", define = yes, start = $0082, size = $007E;

# file header, just $FFFF
    HEADER:     file = %O,               start = $0000, size = $0002;

# "system check" load chunk
    SYSCHKHDR:  file = %O,               start = $0000, size = $0004;
    SYSCHKCHNK: file = %O,               start = $2E00, size = $0300;
    SYSCHKTRL:  file = %O,               start = $0000, size = $0006;

# "main program" load chunk
    MAINHDR:    file = %O,               start = $0000, size = $0004;
    MAIN:       file = %O, define = yes, start = %S,    size = $9100 - %S;   # stops at the framebuffer
    TRAILER:    file = %O,               start = $0000, size = $0006;
}
SEGMENTS {
    ZEROPAGE:  load = ZP,         type = zp;
    EXTZP:     load = ZP,         type = zp,                optional = yes;
    EXEHDR:    load = HEADER,     type = ro;
    SYSCHKHDR: load = SYSCHKHDR,  type = ro,                optional = yes;
    SYSCHK:    load = SYSCHKCHNK, type = rw,  define = yes, optional = yes;
    SYSCHKTRL: load = SYSCHKTRL,  type = ro,                optional = yes;
    MAINHDR:   load = MAINHDR,    type = ro;
    STARTUP:   load = MAIN,       type = ro,  define = yes;
    LOWBSS:    load = MAIN,       type = rw,                optional = yes;  # not zero initialized
    LOWCODE:   load = MAIN,       type = ro,  define = yes, optional = yes;
    ONCE:      load = MAIN,       type = ro,                optional = yes;
    CODE:      load = MAIN,       type = ro,  define = yes;
    RODATA:    load = MAIN,       type = ro;
    DATA:      load = MAIN,       type = rw;
    DLIST:     load = MAIN,       type = rw,  define = yes, optional = yes, align = $0100;
    INIT:      load = MAIN,       type = rw,  define = yes, optional = yes;
    BSS:       load = MAIN,       type = bss, define = yes;
    AUTOSTRT:  load = TRAILER,    type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
